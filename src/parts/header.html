{{logo_defs}}
<a class="skip-link" href="#main">Skip to content</a>
{{promo_strip}}
<header class="site-header" data-header>
  <div class="wrap header-row">
    <a class="brand" href="{{url:home}}" aria-label="{{site_name}} home">
      {{logo}}
      {{brand_text}}
    </a>
    <nav class="primary-nav" id="primary-nav" aria-label="Main">
      {{nav}}
      <button class="nav-search" type="button" aria-label="Search the site" data-search-open>{{icon:search}}</button>
      {{header_cta}}
    </nav>
    <button class="nav-search nav-search-mobile" type="button" aria-label="Search the site" data-search-open>{{icon:search}}</button>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="primary-nav" aria-expanded="false" data-menu-toggle>{{icon:menu}}</button>
  </div>
</header>
<dialog class="search-dialog" aria-label="Search the site" data-search data-search-index="{{search_index}}" {{search_attrs}}>
  <div class="search-panel">
    <form class="search-form" role="search" action="{{url:home}}" method="get">
      {{icon:search}}
      <label class="sr-only" for="site-search">Search the site</label>
      <input id="site-search" type="search" name="s" placeholder="Search services, groups, events&hellip;" autocomplete="off" spellcheck="false">
      <button class="search-close" type="button" data-search-close aria-label="Close search">Esc</button>
    </form>
    <div class="search-quick" data-search-quick>
      <p>Popular</p>
      {{search_quick}}
    </div>
    <p class="search-status" data-search-status aria-live="polite"></p>
    <ol class="search-results" data-search-results></ol>
  </div>
</dialog>
