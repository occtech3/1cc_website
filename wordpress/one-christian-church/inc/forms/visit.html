<form class="occ-form" id="occ-form-visit" method="post" action="{{form_action}}">{{form_hidden}}<div class="form-row"><div class="field"><label for="visit-name">Name</label><input id="visit-name" name="name" required></div><div class="field"><label for="visit-email">Email</label><input id="visit-email" name="email" type="email" required></div></div><div class="form-row"><div class="field"><label for="visit-date">Which Sunday?</label><input id="visit-date" name="date" type="date"></div><div class="field"><label for="visit-kids">Bringing kids?</label><select id="visit-kids" name="kids"><option>No</option><option>Yes, infants&ndash;K</option><option>Yes, 1st&ndash;5th grade</option><option>Yes, both</option></select></div></div><button class="btn btn-sun" type="submit">Plan my visit <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>{{form_status}}</form>
