<form class="occ-form" id="occ-form-contact" method="post" action="{{form_action}}">{{form_hidden}}<div class="form-row"><div class="field"><label for="contact-name">Name</label><input id="contact-name" name="name" required></div><div class="field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" required></div></div><div class="field"><label for="contact-topic">I'd like to&hellip;</label><select id="contact-topic" name="topic"><option>Plan a visit</option><option>Ask a question</option><option>Share a prayer request</option><option>Get connected to a ministry</option><option>Something else</option></select></div><div class="field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="5" required></textarea></div><button class="btn btn-sun" type="submit">Send message <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>{{form_status}}</form>
